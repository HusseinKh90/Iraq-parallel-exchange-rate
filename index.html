/* Layout: one editorial column; full-width pale bands separate sections, as on the Iraqi Data banking page.

}

    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1517; --panel:#141d20; --band:#111a1c; --ink:#e6eded; --muted:#9bacb0; --rule:#2a373b; --grid:#222e32;

<script>
(async function(){
'use strict';
const EMBEDDED = /*DATA*/null, EMBEDDED_STATS = /*STATS*/null;
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
async function loadData(){
  const res = await fetch('data/daily_fx.csv', {cache:'no-cache'}); if (!res.ok) throw new Error('HTTP ' + res.status);
  const rows = parseCSV(await res.text()), head = rows[0], ix = k => head.indexOf(k);
  const num = v => (v === '' || v == null) ? null : Math.round(parseFloat(v) * 100) / 100;
  const out = {d:[], b:[], s:[], e:[]};
  for (let i = 1; i < rows.length; i++){ const r = rows[i]; if (!r[0]) continue; out.d.push(r[0]); out.b.push(num(r[ix('baghdad_close')])); out.s.push(num(r[ix('basra_close')])); out.e.push(num(r[ix('erbil_close')])); }
  return out;

const state = {lang:initialLang(), range:'ALL', tab:'chart', on:{b:true,s:false,e:false,o:true}, inv:{b:true,s:false,e:false,o:true}, ir:'ALL', vr:'ALL', dr:'ALL', cr:'ALL'};
const L = () => I18N[state.lang];
const fd = (ds, opts) => new Intl.DateTimeFormat(L().locale, Object.assign({timeZone:'UTC'}, opts || {day:'numeric',month:'short',year:'numeric'})).format(new Date(ds + 'T00:00:00Z'));

const fdl = ds => state.lang === 'en' ? new Intl.DateTimeFormat('en-US', {timeZone:'UTC', day:'numeric', month:'long', year:'numeric'}).format(new Date(ds + 'T00:00:00Z')) : fd(ds);

const RANGE_DAYS = {'1M':31,'3M':92,'6M':183,'1Y':366,'5Y':1827,'ALL':1e9};
const rangeStartFor = r => { const t = T[N-1] - (r === '3Y' ? 1096 : RANGE_DAYS[r])*DAY; let i = 0; while (i < N-1 && T[i] < t) i++; return i; };
const rangeStart = () => rangeStartFor(state.range);

/* ---------------------------------------------------------------- chart engine */
function niceTicks(lo, hi, n){
  if (hi === lo) hi = lo + 1;
  const raw = (hi - lo) / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  const a = Math.floor(lo/step + 1e-9) * step, b = Math.ceil(hi/step - 1e-9) * step, out = [];
  for (let v = a; v <= b + step*0.001; v += step) out.push(+v.toFixed(10));
  return out;
}
function xTicks(x0, x1, iw){
  const span = (x1 - x0) / DAY, target = span / Math.max(2, Math.floor(iw / 88));
  const units = [['week',7],['2week',14],['month',30.4],['quarter',91.3],['half',182.6],['year',365.25]];
  const u = units.find(u => u[1] >= target) || units[units.length-1], out = [];
  if (u[0] === 'week' || u[0] === '2week'){
    let t = x0 + ((7 - new Date(x0).getUTCDay()) % 7) * DAY;
    for (; t <= x1; t += u[1]*DAY) out.push({t, unit:u[0]});
  } else {
    const stepM = u[0] === 'month' ? 1 : u[0] === 'quarter' ? 3 : u[0] === 'half' ? 6 : 12, d0 = new Date(x0);
    let mi = Math.ceil((d0.getUTCFullYear()*12 + d0.getUTCMonth()) / stepM) * stepM;
    for (;; mi += stepM){ const t = Date.UTC(Math.floor(mi/12), mi % 12, 1); if (t > x1) break; if (t >= x0) out.push({t, unit:u[0]}); }
  }
  return out;
}
const tickLabel = tk => {
  const ds = new Date(tk.t).toISOString().slice(0,10);
  if (tk.unit === 'year') return fd(ds,{year:'numeric'});
  if (tk.unit === 'week' || tk.unit === '2week') return fd(ds,{day:'numeric',month:'short'});
  return fd(ds,{month:'short',year:'numeric'});
};
const SVGNS = 'http://www.w3.org/2000/svg';
const el = (name, attrs, parent) => { const n = document.createElementNS(SVGNS, name); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };

/* cfg: {height, i0, series:[{id,data,color,w,dash,step}], zero, area, events, endLabels, tip(i)->{rows,foot}, fmt, yFmt, label} */
function drawChart(host, cfg){
  host.innerHTML = ''; host.style.direction = 'ltr';
  const W = Math.max(280, host.clientWidth), narrow = W < 600, H = narrow ? Math.round(cfg.height*0.82) : cfg.height;
  const m = {l: cfg.ml || (narrow ? 40 : 48), r: cfg.endLabels && !narrow ? (cfg.mr || 96) : 14, t: cfg.events ? 30 : 14, b: 28};
  const iw = W - m.l - m.r, ih = H - m.t - m.b, i0 = cfg.i0, i1 = N - 1, x0 = T[i0], x1 = T[i1];
  const X = t => m.l + (t - x0) / ((x1 - x0) || 1) * iw;
  let lo = Infinity, hi = -Infinity;
  cfg.series.forEach(s => { for (let i = i0; i <= i1; i++){ const v = s.data[i]; if (v != null){ if (v < lo) lo = v; if (v > hi) hi = v; } } });
  if (cfg.ribbon) for (let i = i0; i <= i1; i++){ const a = cfg.ribbon.hi[i], b = cfg.ribbon.lo[i]; if (a != null && a > hi) hi = a; if (b != null && b < lo) lo = b; }
  if (cfg.zero){ lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const ticks = niceTicks(lo, hi, narrow ? 4 : 6), yMin = ticks[0], yMax = ticks[ticks.length-1];
  const Y = v => m.t + (1 - (v - yMin) / ((yMax - yMin) || 1)) * ih;

  const svg = el('svg', {viewBox:`0 0 ${W} ${H}`, width:W, height:H, role:'img', 'aria-label':cfg.label || L().chartLabel}, host);
  ticks.forEach(v => {
    el('line', {x1:m.l, x2:m.l+iw, y1:Y(v), y2:Y(v), style:'stroke:var(--grid);stroke-width:1;stroke-dasharray:3 3'}, svg);
    const t = el('text', {x:m.l-8, y:Y(v)+4, 'text-anchor':'end'}, svg); t.textContent = (cfg.yFmt || (z => nf(z,0)))(v);
  });
  if (cfg.zero) el('line', {x1:m.l, x2:m.l+iw, y1:Y(0), y2:Y(0), style:'stroke:var(--muted);stroke-width:1.2'}, svg);
  xTicks(x0, x1, iw).forEach(tk => {
    const x = X(tk.t);
    el('line', {x1:x, x2:x, y1:m.t+ih, y2:m.t+ih+4, style:'stroke:var(--muted);stroke-width:1'}, svg);
    const t = el('text', {x, y:m.t+ih+18, 'text-anchor':'middle'}, svg); t.textContent = tickLabel(tk);
  });
  el('line', {x1:m.l, x2:m.l+iw, y1:m.t+ih, y2:m.t+ih, style:'stroke:var(--muted);stroke-width:1'}, svg);

  if (cfg.events){
    EVENTS.forEach(ev => {
      const ti = Date.parse(ev.date + 'T00:00:00Z'); if (ti < x0 || ti > x1) return;
      const x = X(ti);
      el('line', {x1:x, x2:x, y1:m.t-4, y2:m.t+ih, style:'stroke:var(--muted);stroke-width:1;stroke-dasharray:1 3'}, svg);
      el('circle', {cx:x, cy:m.t-14, r:9, style:'fill:var(--panel);stroke:var(--ink);stroke-width:1.2'}, svg);
      const t = el('text', {x, y:m.t-10, 'text-anchor':'middle', style:'fill:var(--ink);font-weight:600;font-size:11px'}, svg); t.textContent = ev.id;
    });
  }
  if (cfg.ribbon){
    const up = [], dn = [];
    for (let i = i0; i <= i1; i++){ const a = cfg.ribbon.hi[i], b = cfg.ribbon.lo[i]; if (a == null || b == null) continue; const x = X(T[i]).toFixed(1); up.push(x + ',' + Y(a).toFixed(1)); dn.push(x + ',' + Y(b).toFixed(1)); }
    if (up.length > 1) el('path', {d:'M' + up.join(' L') + ' L' + dn.reverse().join(' L') + ' Z', style:`fill:${cfg.ribbon.color};opacity:.16;stroke:none`}, svg);
  }
  const pathFor = (s, from, to) => {
    let d = '', pen = false, prev = null;
    for (let i = from; i <= to; i++){
      const v = s.data[i]; if (v == null) continue;
      const x = X(T[i]);
      if (s.step && prev != null && v !== prev){ d += ` L${x.toFixed(1)},${Y(prev).toFixed(1)}`; }
      d += (pen ? ' L' : 'M') + x.toFixed(1) + ',' + Y(v).toFixed(1); pen = true; prev = v;
    }
    return d;
  };
  cfg.series.forEach(s => {
    const sty = `fill:none;stroke:${s.color};stroke-width:${s.w};stroke-linejoin:round;stroke-linecap:round` + (s.dash ? `;stroke-dasharray:${s.dash}` : '');
    if (cfg.area && s.id === 'prem'){
      let d = pathFor(s, i0, i1); if (d){ const fx = X(T[i0]), lx = X(T[i1]);
        el('path', {d: d + ` L${lx.toFixed(1)},${Y(0).toFixed(1)} L${fx.toFixed(1)},${Y(0).toFixed(1)} Z`, style:`fill:${s.color};opacity:.13;stroke:none`}, svg); }
    }
    el('path', {d:pathFor(s, i0, i1), style:sty}, svg);
  });

  /* direct labels at the line ends */
  if (cfg.endLabels && !narrow){
    const items = cfg.series.filter(s => s.label).map(s => { let li = -1; for (let i = i1; i >= i0; i--) if (s.data[i] != null){ li = i; break; } return li < 0 ? null : {s, y:Y(s.data[li])}; }).filter(Boolean).sort((a,b) => a.y - b.y);
    for (let k = 1; k < items.length; k++) if (items[k].y - items[k-1].y < 17) items[k].y = items[k-1].y + 17;
    items.forEach(it => { const d = document.createElement('div'); d.className = 'lbl'; d.textContent = it.s.label; d.style.cssText = `left:${m.l+iw+8}px;top:${it.y-8}px;color:${it.s.color}`; d.dir = state.lang === 'ar' ? 'rtl' : 'ltr'; host.appendChild(d); });
  }

  /* hover / keyboard cursor */
  const cur = el('g', {style:'display:none'}, svg);
  const vline = el('line', {y1:m.t, y2:m.t+ih, style:'stroke:var(--ink);stroke-width:1;opacity:.55'}, cur);
  const dots = cfg.series.map(s => el('circle', {r:4, style:`fill:var(--panel);stroke:${s.color};stroke-width:2`}, cur));
  const tip = document.createElement('div'); tip.className = 'tip'; tip.style.display = 'none'; tip.dir = state.lang === 'ar' ? 'rtl' : 'ltr'; host.appendChild(tip);
  let curIdx = null;
  const nearest = t => { let lo2 = i0, hi2 = i1; while (hi2 - lo2 > 1){ const mid = (lo2 + hi2) >> 1; if (T[mid] < t) lo2 = mid; else hi2 = mid; } return (t - T[lo2] <= T[hi2] - t) ? lo2 : hi2; };
  const show = i => {
    curIdx = i; const x = X(T[i]); cur.style.display = ''; vline.setAttribute('x1', x); vline.setAttribute('x2', x);
    cfg.series.forEach((s, k) => { const v = s.data[i]; if (v == null) dots[k].style.display = 'none'; else { dots[k].style.display = ''; dots[k].setAttribute('cx', x); dots[k].setAttribute('cy', Y(v)); } });
    const info = cfg.tip(i);
    tip.innerHTML = `<div class="d">${fd(DATA.d[i])}</div>` + info.rows.map(r => `<div class="r"><span><i style="--sw:${r.color}"></i>${r.name}</span><b>${r.value}</b></div>`).join('') + (info.foot ? `<div class="f">${info.foot}</div>` : '');
    tip.style.display = 'block';
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = x + 14; if (left + tw > W - 4) left = x - 14 - tw; if (left < 4) left = 4;
    tip.style.left = left + 'px'; tip.style.top = Math.max(2, Math.min(m.t + 6, H - th - 30)) + 'px';
  };
  const hide = () => { curIdx = null; cur.style.display = 'none'; tip.style.display = 'none'; };
  host.onpointermove = ev => { const r = host.getBoundingClientRect(), px = ev.clientX - r.left; if (px < m.l - 4 || px > m.l + iw + 4) return hide(); show(nearest(x0 + (px - m.l) / iw * (x1 - x0))); };
  host.onpointerleave = hide;
  host.tabIndex = 0; host.setAttribute('role', 'group'); host.setAttribute('aria-label', cfg.label || L().chartLabel);
  host.onkeydown = ev => {
    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight'){ ev.preventDefault(); const d = ev.key === 'ArrowLeft' ? -1 : 1; show(Math.max(i0, Math.min(i1, (curIdx == null ? i1 : curIdx) + d))); }
    else if (ev.key === 'Escape') hide();
  };
  host.onblur = hide;
}

function sparkline(vals, color){
  const w = 96, h = 28, pts = vals.filter(v => v != null); if (pts.length < 2) return '';
  const lo = Math.min(...pts), hi = Math.max(...pts), n = vals.length; let d = '', last = null;
  vals.forEach((v, i) => { if (v == null) return; const x = 2 + i/(n-1)*(w-4), y = 3 + (1 - (v-lo)/((hi-lo)||1))*(h-6); d += (d ? ' L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1); last = [x,y]; });
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" style="fill:none;stroke:${color};stroke-width:1.6"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6" style="fill:${color}"/></svg>`;
}

/* ---------------------------------------------------------------- derived numbers */
const iB = lastIdx(DATA.b);

/* ---------------------------------------------------------------- stability and dispersion */
const pctl = (a, p) => { const k = (a.length - 1) * p, f = Math.floor(k), c = Math.ceil(k); return a[f] + (a[c] - a[f]) * (k - f); };
const sortNum = a => a.slice().sort((x, y) => x - y);
const CH = []; { let prev = -1; for (let i = 0; i < N; i++){ if (DATA.b[i] == null) continue; if (prev >= 0) CH.push({i, date:DATA.d[i], pct:100*Math.log(DATA.b[i]/DATA.b[prev]), from:DATA.b[prev], to:DATA.b[i]}); prev = i; } }
const VOLW = 30, VSD = new Array(N).fill(null), VMED = new Array(N).fill(null), VWIN = new Array(N).fill(null);
for (let k = VOLW - 1; k < CH.length; k++){
  const v = CH.slice(k - VOLW + 1, k + 1).map(c => c.pct), mu = v.reduce((a, b) => a + b, 0) / VOLW;
  VSD[CH[k].i] = Math.sqrt(v.reduce((a, b) => a + (b - mu) * (b - mu), 0) / (VOLW - 1));
  VMED[CH[k].i] = pctl(sortNum(v.map(Math.abs)), .5); VWIN[CH[k].i] = k;
}
const GAP = DATA.d.map((_, i) => { const v = [DATA.b[i], DATA.s[i], DATA.e[i]]; return v.some(x => x == null) ? null : 100 * (Math.max(...v) - Math.min(...v)) / Math.min(...v); });
const DMED = new Array(N).fill(null), DLO = new Array(N).fill(null), DHI = new Array(N).fill(null);
{ const obs = []; for (let i = 0; i < N; i++){ if (GAP[i] == null) continue; obs.push(GAP[i]); if (obs.length >= VOLW){ const q = sortNum(obs.slice(-VOLW)); DMED[i] = pctl(q, .5); DLO[i] = pctl(q, .05); DHI[i] = pctl(q, .95); } } }

const srcRight = (id, show = true) => `<span class="srcr"><span>${L().lic}</span>${show ? `<button class="dl" type="button" data-dl="${id}">${L().dlImg}</button>` : ''}</span>`;

const segHTML = (g, list, cur) => `<div class="seg" role="group">${list.map(r => `<button type="button" data-g="${g}" data-r="${r}" aria-pressed="${cur === r}">${rl(r)}</button>`).join('')}</div>`;

const yDec = v => (Math.abs(v - Math.round(v * 10) / 10) < 1e-9 ? nf(v, 1) : nf(v, 2)) + '%';
const frameWrap = (h, sub, take, controls, plot, extra, method, l, hid, srcLine) => `<section class="frame"><div class="frame-h"><h3>${h}</h3><p class="sub">${sub}</p></div>${take ? `<p class="takeaway">${take}</p>` : ''}${controls}${plot}${extra}<p class="hint method">${method}</p><div class="src"><span>${srcLine || l.srcB}</span>${srcRight(hid)}</div></section>`;

  drawDist({v, med, p5, p95});

function drawHist(host, o){
  host.innerHTML = ''; host.style.direction = 'ltr';
  const l = L(), W = Math.max(280, host.clientWidth), narrow = W < 600, H = narrow ? 270 : 330;
  const m = {l:narrow ? 40 : 48, r:14, t:18, b:50}, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const LIM = 1.5, BW = 0.1, NB = 30, S = NB + 2, sw = iw / S, n = o.v.length, cnt = new Array(S).fill(0);
  o.v.forEach(x => { if (x < -LIM) cnt[0]++; else if (x >= LIM) cnt[S - 1]++; else cnt[1 + Math.min(NB - 1, Math.floor((x + LIM) / BW + 1e-9))]++; });
  const share = cnt.map(c => c / n * 100), ticks = niceTicks(0, Math.max(...share), 4), top = ticks[ticks.length - 1];
  const Y = q => m.t + (1 - q / top) * ih, XS = j => m.l + j * sw, XV = x => m.l + (1 + (Math.max(-LIM, Math.min(LIM, x)) + LIM) / BW) * sw;
  const svg = el('svg', {viewBox:`0 0 ${W} ${H}`, width:W, height:H, role:'img', 'aria-label':l.histLabel}, host);
  ticks.forEach(t => { el('line', {x1:m.l, x2:m.l + iw, y1:Y(t), y2:Y(t), style:'stroke:var(--grid);stroke-width:1;stroke-dasharray:3 3'}, svg); const tx = el('text', {x:m.l - 8, y:Y(t) + 4, 'text-anchor':'end'}, svg); tx.textContent = nf(t, t % 1 ? 1 : 0) + '%'; });
  el('rect', {x:XV(o.p5), y:m.t, width:Math.max(1, XV(o.p95) - XV(o.p5)), height:ih, style:'fill:var(--accent-soft)'}, svg);

  [0, S - 1].forEach(j => { if (cnt[j]){ const t = el('text', {x:XS(j) + sw / 2, y:Y(share[j]) - 5, 'text-anchor':'middle', style:'font-size:11px'}, svg); t.textContent = cnt[j]; } });

  el('line', {x1:XV(o.med), x2:XV(o.med), y1:m.t, y2:m.t + ih, style:'stroke:var(--ink);stroke-width:1.6'}, svg);

  const tip = document.createElement('div'); tip.className = 'tip'; tip.style.display = 'none'; tip.dir = state.lang === 'ar' ? 'rtl' : 'ltr'; host.appendChild(tip);

    tip.style.display = 'block'; const tw = tip.offsetWidth; let left = XS(j) + sw + 8; if (left + tw > W - 4) left = XS(j) - 8 - tw; tip.style.left = Math.max(4, left) + 'px'; tip.style.top = Math.max(2, m.t) + 'px';
  };
  host.onpointerleave = () => { tip.style.display = 'none'; };
}

/* ---------------------------------------------------------------- dinar rate against the dollar (reciprocal of the dollar rate) */
const recip = v => v == null ? null : 1 / v;
const INV = {b:DATA.b.map(recip), s:DATA.s.map(recip), e:DATA.e.map(recip), o:OFF.map(recip)};
const INV_KEYS = ['b','s','e','o'];
const nf6 = v => nf(v, 6);
function renderInv(){
  const l = L(), i0 = rangeStartFor(state.ir);
  const chips = INV_KEYS.map(k => `<button class="chip${k==='o'?' dash':''}" type="button" data-ik="${k}" aria-pressed="${state.inv[k]}" style="--sw:${SERIES[k].color}"><i></i>${l.names[k]}</button>`).join('');
  const controls = `<div class="controls"><div class="chips" role="group">${chips}</div>${segHTML('ir', ['1M','3M','6M','1Y','5Y','ALL'], state.ir)}</div>`;
  const take = l.invTake(fdl(DATA.d[iB]), nf6(INV.b[iB]), nf(DATA.b[iB], 1));
  document.getElementById('inverse').innerHTML = `<div class="wrap" style="padding:0">${frameWrap(l.invT, l.invS, take, controls, '<div class="plot"><div class="host" id="invhost"></div></div>', evNotes(i0, true), l.invMethod(), l, 'invhost', l.src)}</div>`;
  drawInv();
}
function drawInv(){
  const host = document.getElementById('invhost'); if (!host) return; const l = L(), i0 = rangeStartFor(state.ir);
  const series = INV_KEYS.filter(k => state.inv[k]).map(k => ({id:'i' + k, data:INV[k], color:SERIES[k].color, w:SERIES[k].w, dash:SERIES[k].dash, step:SERIES[k].step, label:l.short[k]}));
  drawChart(host, {height:400, i0, series, events:true, endLabels:true, ml:72, label:l.invLabel, yFmt:v => v.toFixed(6),
    tip:i => { const rows = INV_KEYS.filter(k => state.inv[k]).map(k => ({name:l.names[k], color:SERIES[k].color, value:INV[k][i] == null ? '—' : nf6(INV[k][i])})).sort((a,b) => (parseFloat(b.value) || -1) - (parseFloat(a.value) || -1)); return {rows, foot:rows.some(r => r.value === '—') ? l.noq : ''}; }});
}

/* ---------------------------------------------------------------- share kit */
const shareURL = () => SITE_URL + (state.lang === 'ar' ? '?lang=ar' : '');
function renderShare(){
  const l = L(), u = encodeURIComponent(shareURL()), t = encodeURIComponent(l.shareText), tu = encodeURIComponent(l.shareText + ' ' + shareURL()), box = document.getElementById('share');
  const a = (href, name) => `<a href="${href}" target="_blank" rel="noopener">${name}</a>`;
  box.innerHTML = `<summary>${l.share}</summary><div class="menu">${a('https://www.linkedin.com/sharing/share-offsite/?url=' + u, 'LinkedIn')}${a('https://www.facebook.com/sharer/sharer.php?u=' + u, 'Facebook')}${a('https://wa.me/?text=' + tu, 'WhatsApp')}${a('https://t.me/share/url?url=' + u + '&text=' + t, 'Telegram')}${a('https://twitter.com/intent/tweet?url=' + u + '&text=' + t, 'X')}<button type="button" data-copy="link">${l.copyLink}</button></div>`;
}
async function copyText(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch (err) { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e2) {} ta.remove(); }
  const old = btn.textContent; btn.textContent = L().copied; setTimeout(() => { btn.textContent = old; }, 1800);
}
const EXPORTS = {
  mainhost:{file:'iraq-dollar-rate', t:l => l.mainT, s:l => l.mainS, legend:l => ['b','s','e','o'].filter(k => state.on[k]).map(k => ({c:SERIES[k].color, t:l.names[k], k:k === 'o' ? 'dash' : 'line', w:3}))},
  premhost:{file:'iraq-street-vs-official-rate', t:l => l.premT, s:l => l.premS, legend:() => []},
  volhost:{file:'iraq-daily-volatility', t:l => l.volT, s:l => l.volS, legend:l => [{c:SERIES.b.color, t:l.volSdT, k:'line', w:4}, {c:SERIES.b.color, t:l.volMdT, k:'line', w:2}]},
  disthost:{file:'iraq-daily-change-distribution', t:l => l.distT, s:l => l.distS, legend:l => [{c:'var(--c-bag)', t:l.kBars, k:'box'}, {c:'var(--muted)', t:l.kTail, k:'box', o:.75}, {c:'var(--accent-soft)', t:l.kBand, k:'box'}, {c:'var(--ink)', t:l.kMed, k:'line', w:3}]},
  invhost:{file:'iraq-dinar-rate-against-dollar', t:l => l.invT, s:l => l.invS, legend:l => INV_KEYS.filter(k => state.inv[k]).map(k => ({c:SERIES[k].color, t:l.names[k], k:k === 'o' ? 'dash' : 'line', w:3}))},
  disphost:{file:'iraq-city-dispersion', t:l => l.dispT, s:l => l.dispS, legend:l => [{c:'var(--ink)', t:l.dispMedT, k:'line', w:3}, {c:'var(--muted)', t:l.dispBandT, k:'box', o:.35}]}
};
async function exportChart(id){
  const cfg = EXPORTS[id], host = document.getElementById(id), src = host && host.querySelector('svg'); if (!cfg || !src) return;
  const l = L(), rtl = state.lang === 'ar', res = x => String(x).replace(/var\((--[\w-]+)\)/g, (_, n) => LIGHT[n] || n);
  const esc = x => String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const W = 1200, pad = 44, vb = src.viewBox.baseVal, chartH = Math.round(vb.height * (W - 2 * pad) / vb.width);
  const SERIF = "Georgia, 'Times New Roman', serif", SANS = rtl ? 'Tahoma, Arial, sans-serif' : 'Arial, Helvetica, sans-serif';
  const anchor = 'start', ax = rtl ? W - pad : pad, dir = rtl ? 'rtl' : 'ltr', mctx = document.createElement('canvas').getContext('2d');
  const fit = (text, size, family, weight) => { mctx.font = `${weight || 400} ${size}px ${family}`; const w = mctx.measureText(text).width, max = W - 2 * pad; return w > max ? Math.max(10, size * max / w) : size; };
  const legend = cfg.legend(l), notes = [...host.closest('.frame').querySelectorAll('.notes li')].map(li => li.textContent.replace(/\s+/g, ' ').trim());
  const headH = 92 + (legend.length ? 34 : 0), notesH = notes.length ? notes.length * 22 + 12 : 0, footH = 78, H = headH + chartH + notesH + footH;
  const body = src.cloneNode(true);
  body.setAttribute('x', pad); body.setAttribute('y', headH); body.setAttribute('width', W - 2 * pad); body.setAttribute('height', chartH); body.setAttribute('style', 'overflow:visible');
  body.querySelectorAll('[style]').forEach(n => n.setAttribute('style', res(n.getAttribute('style'))));
  body.querySelectorAll('text').forEach(n => { const st = n.getAttribute('style') || ''; if (!/fill:/.test(st)) n.setAttribute('fill', LIGHT['--muted']); n.setAttribute('font-family', SANS); if (!/font-size/.test(st)) n.setAttribute('font-size', '12'); });
  host.querySelectorAll('.lbl').forEach(d => { const t = document.createElementNS('http://www.w3.org/2000/svg', 'text'); t.setAttribute('x', parseFloat(d.style.left)); t.setAttribute('y', parseFloat(d.style.top) + 12); t.setAttribute('fill', res(d.style.color)); t.setAttribute('font-family', SANS); t.setAttribute('font-size', '14'); t.setAttribute('font-weight', '700'); t.textContent = d.textContent; body.appendChild(t); });
  let lg = '', lx = rtl ? W - pad : pad; const ly = 88 + 14;
  legend.forEach(it => {
    mctx.font = `14px ${SANS}`; const tw = mctx.measureText(it.t).width, sw = 26, col = res(it.c), w = it.w || 3;
    const x0 = rtl ? lx - sw : lx;
    lg += it.k === 'box' ? `<rect x="${x0}" y="${ly - 7}" width="${sw - 10}" height="14" fill="${col}" opacity="${it.o || 1}" stroke="${LIGHT['--rule']}"/>` : `<line x1="${x0}" x2="${x0 + sw - 6}" y1="${ly}" y2="${ly}" stroke="${col}" stroke-width="${w}" ${it.k === 'dash' ? 'stroke-dasharray="6 4"' : ''}/>`;
    lg += `<text x="${rtl ? x0 - 8 : x0 + sw + 2}" y="${ly + 5}" text-anchor="${anchor}" direction="${dir}" font-family="${SANS}" font-size="14" fill="${LIGHT['--ink']}">${esc(it.t)}</text>`;
    lx += (rtl ? -1 : 1) * (sw + tw + 32);
  });
  const ny = headH + chartH + 24; let nt = '';
  notes.forEach((n, i) => { nt += `<text x="${ax}" y="${ny + i * 22}" text-anchor="${anchor}" direction="${dir}" font-family="${SANS}" font-size="${fit(n, 13, SANS)}" fill="${LIGHT['--muted']}">${esc(n)}</text>`; });
  const title = cfg.t(l), sub = cfg.s(l), fy = H - footH + 24;
  const foot1 = l.srcB, foot2 = `${l.dataTo} ${fd(DATA.d[N - 1])} · CC BY 4.0 · husseinkh90.github.io/Iraq-parallel-exchange-rate · doi:10.5281/zenodo.23209867`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="${LIGHT['--panel']}"/><rect width="${W}" height="6" fill="${LIGHT['--accent']}"/>`
    + `<text x="${ax}" y="46" text-anchor="${anchor}" direction="${dir}" font-family="${rtl ? SANS : SERIF}" font-size="${fit(title, 28, rtl ? SANS : SERIF, 700)}" font-weight="700" fill="${LIGHT['--ink']}">${esc(title)}</text>`
    + `<text x="${ax}" y="72" text-anchor="${anchor}" direction="${dir}" font-family="${SANS}" font-size="${fit(sub, 16, SANS)}" fill="${LIGHT['--muted']}">${esc(sub)}</text>`
    + lg + new XMLSerializer().serializeToString(body) + nt
    + `<line x1="${pad}" x2="${W - pad}" y1="${H - footH + 4}" y2="${H - footH + 4}" stroke="${LIGHT['--rule']}"/>`
    + `<text x="${ax}" y="${fy}" text-anchor="${anchor}" direction="${dir}" font-family="${SANS}" font-size="${fit(foot1, 13, SANS)}" fill="${LIGHT['--muted']}">${esc(foot1)}</text>`
    + `<text x="${ax}" y="${fy + 22}" text-anchor="${anchor}" direction="${dir}" font-family="${SANS}" font-size="${fit(foot2, 13, SANS)}" fill="${LIGHT['--muted']}">${esc(foot2)}</text></svg>`;
  const img = new Image(), url = URL.createObjectURL(new Blob([svg], {type:'image/svg+xml;charset=utf-8'}));
  await new Promise((ok, bad) => { img.onload = ok; img.onerror = bad; img.src = url; });
  const cv = document.createElement('canvas'); cv.width = W * 2; cv.height = H * 2; const cx = cv.getContext('2d'); cx.fillStyle = LIGHT['--panel']; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
  cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `${cfg.file}-${DATA.d[N - 1]}.png`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }, 'image/png');
}
document.addEventListener('click', ev => {
  const dl = ev.target.closest('[data-dl]'), cp = ev.target.closest('[data-copy]'), sh = document.getElementById('share');
  if (dl) exportChart(dl.dataset.dl).catch(e => console.error('image export failed:', e && e.message || e));
  else if (cp){ const k = cp.dataset.copy; copyText(k === 'link' ? shareURL() : k === 'apa' ? CITE_APA : CITE_BIB, cp); }
  if (sh && sh.open && !sh.contains(ev.target)) sh.open = false;
});
document.addEventListener('keydown', ev => { const sh = document.getElementById('share'); if (ev.key === 'Escape' && sh && sh.open){ sh.open = false; sh.querySelector('summary').focus(); } });

/* ---------------------------------------------------------------- events */
document.getElementById('lang').addEventListener('click', () => { state.lang = state.lang === 'en' ? 'ar' : 'en'; try { localStorage.setItem('fxlang', state.lang); } catch (err) {} renderAll(); });
document.getElementById('main').addEventListener('click', ev => {
  const c = ev.target.closest('[data-k]'), r = ev.target.closest('[data-r]'), t = ev.target.closest('[data-t]');
  if (c){ const k = c.dataset.k, n = Object.values(state.on).filter(Boolean).length; if (state.on[k] && n === 1) return; state.on[k] = !state.on[k]; renderMain(); const b = document.querySelector(`[data-k="${k}"]`); if (b) b.focus(); }
  else if (r){ state.range = r.dataset.r; renderMain(); const b = document.querySelector(`[data-r="${r.dataset.r}"]`); if (b) b.focus(); }
  else if (t){ state.tab = t.dataset.t; renderMain(); const b = document.querySelector(`[data-t="${t.dataset.t}"]`); if (b) b.focus(); }
});
document.getElementById('inverse').addEventListener('click', ev => {
  const c = ev.target.closest('[data-ik]'), r = ev.target.closest('[data-g="ir"]');
  if (c){ const k = c.dataset.ik, n = INV_KEYS.filter(x => state.inv[x]).length; if (state.inv[k] && n === 1) return; state.inv[k] = !state.inv[k]; renderInv(); const b = document.querySelector(`[data-ik="${k}"]`); if (b) b.focus(); }
  else if (r){ state.ir = r.dataset.r; renderInv(); const b = document.querySelector(`[data-g="ir"][data-r="${r.dataset.r}"]`); if (b) b.focus(); }
});
['stability', 'dispersion'].forEach(id => document.getElementById(id).addEventListener('click', ev => {
  const b = ev.target.closest('[data-g]'); if (!b) return; const g = b.dataset.g; state[g] = b.dataset.r;
  ({vr:renderVol, dr:renderDist, cr:renderDisp})[g](); const nb = document.querySelector(`[data-g="${g}"][data-r="${b.dataset.r}"]`); if (nb) nb.focus();
}));
let rq = 0, lastW = 0;
new ResizeObserver(() => { const w = document.getElementById('app').clientWidth; if (w === lastW) return; lastW = w; cancelAnimationFrame(rq); rq = requestAnimationFrame(() => { fitTitle(); drawMain(); drawInv(); drawPremium(); drawVol(); drawDist(); drawDisp(); }); }).observe(document.getElementById('app'));
renderAll();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
})();
</script>
