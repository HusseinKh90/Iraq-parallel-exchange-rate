name: Update exchange rates and publish dashboard

on:
  schedule:
    # GitHub schedules use UTC: 15:00 UTC = 18:00 Baghdad.
    - cron: '0 15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-data.yml'
      - 'iraq_fx_parser.py'
      - 'requirements.txt'
      - 'index.html'
      - 'data/**'

permissions:
  contents: read

concurrency:
  group: exchange-rate-update-and-pages
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TZ: Asia/Baghdad
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install extractor dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch recent posts and rebuild data
        run: python iraq_fx_parser.py run --mode update
      - name: Validate scrape completion and published data
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path

          reports = json.loads(Path('data/scrape_report.json').read_text())
          expected = {'dollariraqi', 'iqborsa', 'dollar_price'}
          if {r['channel'] for r in reports} != expected:
              raise SystemExit('Missing scrape reports for configured channels')
          for report in reports:
              if report['pages'] < 1 or report['stop_reason'] != 'caught up with cache':
                  raise SystemExit(f"Incomplete scrape: {report['channel']}: {report['stop_reason']}")

          with open('data/daily_fx.csv', encoding='utf-8', newline='') as handle:
              reader = csv.DictReader(handle)
              fields = reader.fieldnames or []
              rates = [f for f in fields if f.endswith(('_open', '_close'))]
              if 'date' not in fields or not rates:
                  raise SystemExit('Published CSV is missing date or rate columns')
              rows = list(reader)
          if not rows:
              raise SystemExit('Published CSV is empty')
          today = datetime.now(timezone(timedelta(hours=3))).date()
          dates = []
          for row in rows:
              day = date.fromisoformat(row['date'])
              if day > today:
                  raise SystemExit(f'Future date in published CSV: {day}')
              dates.append(day)
              values = [float(row[f]) for f in rates if row[f]]
              if not values or any(not math.isfinite(v) or v <= 0 for v in values):
                  raise SystemExit(f'Invalid published rates on {day}')
          if dates != sorted(set(dates)):
              raise SystemExit('Published dates are duplicated or out of order')
          if dates[-1] < today - timedelta(days=5):
              raise SystemExit(f'Published dataset is stale: latest date {dates[-1]}')
          print(f'Validated {len(rows)} daily rows; latest date {dates[-1]}')
          PY
      - name: Run existing channel health checks
        id: health
        continue-on-error: true
        run: python iraq_fx_parser.py check
      - name: Report channel health warnings
        if: steps.health.outcome == 'failure'
        run: |
          echo '::warning::Channel health check raised flags. Review the health-check log; validated data from active sources will still be published.'
          echo '### Channel health warning' >> "$GITHUB_STEP_SUMMARY"
          echo 'The existing health check raised flags. Review its log for stale channels, low match rates, or disagreement between sources. Scrape completion and published CSV validation passed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
          else
            git commit -m "Update exchange-rate data ($(date +%F))"
            git push origin HEAD:main
          fi
      - name: Prepare dashboard artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R data _site/data
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy refreshed dashboard
        id: deployment
        uses: actions/deploy-pages@v4
